name: Shiva Weekly Backtest Summary

on:
  schedule:
    # GitHub Actions uses UTC. 11:30 UTC = 17:00 IST, after the Friday daily summary.
    - cron: "30 11 * * 5"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "nse"
          - "crypto"
          - "xstock"
      timeframe:
        description: "Timeframe to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "30m"
          - "4h"
      week_ending:
        description: "Optional IST week-ending date, YYYY-MM-DD"
        required: false
      dry_run:
        description: "Compute and print the report without posting to Discord"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force:
        description: "Send even if the report was already sent"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: shiva-weekly-backtest-summary
  cancel-in-progress: false

jobs:
  weekly-backtest-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: |
          bash .github/scripts/restore_runtime_state.sh \
            daily_backtest_finalized_records.jsonl \
            daily_backtest_pending_records.jsonl \
            weekly_backtest_reports_sent.json

      - name: Check weekly backtest Discord webhook
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_DAILY_BACKTEST_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_DAILY_BACKTEST_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Post weekly backtest summary
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
          INPUT_WEEK_ENDING: ${{ github.event.inputs.week_ending }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          MARKET="${INPUT_MARKET:-both}"
          TIMEFRAME="${INPUT_TIMEFRAME:-both}"
          run_summary() {
            EXTRA_ARGS=()
            if [ -n "$INPUT_WEEK_ENDING" ]; then
              EXTRA_ARGS+=(--week-ending "$INPUT_WEEK_ENDING")
            fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              EXTRA_ARGS+=(--dry-run)
            fi
            if [ "$INPUT_FORCE" = "true" ]; then
              EXTRA_ARGS+=(--force)
            fi
            python weekly_backtest_summary.py --market "$1" --timeframe "$2" "${EXTRA_ARGS[@]}"
          }

          if [ "$MARKET" = "both" ]; then
            MARKETS="nse crypto xstock"
          else
            MARKETS="$MARKET"
          fi
          if [ "$TIMEFRAME" = "both" ]; then
            TIMEFRAMES="30m 4h"
          else
            TIMEFRAMES="$TIMEFRAME"
          fi

          for market in $MARKETS; do
            for timeframe in $TIMEFRAMES; do
              run_summary "$market" "$timeframe"
            done
          done

      - name: Persist runtime state
        run: bash .github/scripts/persist_runtime_state.sh weekly_backtest_reports_sent.json

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
