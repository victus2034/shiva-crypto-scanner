name: Shiva Weekly Backtest Summary

on:
  schedule:
    # GitHub Actions uses UTC. 11:30 UTC = 17:00 IST, after the Friday daily summary.
    - cron: "30 11 * * 5"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "NSE timeframe to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "30m"
          - "4h"
      week_ending:
        description: "Optional IST week-ending date, YYYY-MM-DD"
        required: false

permissions:
  contents: write

concurrency:
  group: shiva-weekly-backtest-summary
  cancel-in-progress: false

jobs:
  weekly-backtest-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check weekly backtest Discord webhook
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_DAILY_BACKTEST_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_DAILY_BACKTEST_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Post weekly backtest summary
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
          INPUT_WEEK_ENDING: ${{ github.event.inputs.week_ending }}
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: |
          TIMEFRAME="${INPUT_TIMEFRAME:-both}"
          run_summary() {
            if [ -n "$INPUT_WEEK_ENDING" ]; then
              python weekly_backtest_summary.py --timeframe "$1" --week-ending "$INPUT_WEEK_ENDING"
            else
              python weekly_backtest_summary.py --timeframe "$1"
            fi
          }
          if [ "$TIMEFRAME" = "both" ]; then
            run_summary "30m"
            run_summary "4h"
          else
            run_summary "$TIMEFRAME"
          fi

      - name: Persist weekly backtest report state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f weekly_backtest_reports_sent.json ]; then
            git add -f weekly_backtest_reports_sent.json
          fi
          if git diff --cached --quiet; then
            echo "No weekly backtest report state changes to save."
            exit 0
          fi

          git commit -m "Update weekly backtest report state"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "::warning::Weekly backtest state push failed on attempt ${attempt}; refreshing branch before retry."
            git pull --rebase origin main || {
              echo "::warning::Could not rebase weekly backtest state. Report was already sent, so not failing the workflow."
              exit 0
            }
          done

          echo "::warning::Could not persist weekly backtest report state after retries. Report was already sent, so not failing the workflow."
