name: Shiva Crypto Scanner

on:
  # 08:00-01:00 IST is 02:30-19:30 UTC, which does not wrap the date.
  schedule:
    # 08:00 and 08:20 IST
    - cron: "30,50 2 * * *"
    # 08:40 through 00:20 IST
    - cron: "10,30,50 3-18 * * *"
    # 00:40 and 01:00 IST
    - cron: "10,30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shiva-crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: bash .github/scripts/restore_runtime_state.sh alert_state.json crypto_alert_records.jsonl

      - name: Check Discord webhook configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured."
          else
            echo "DISCORD_WEBHOOK_URL is configured."
          fi

          if [ -z "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_STATUS_WEBHOOK_URL is not configured. Scanner status will fall back to alert webhook."
          else
            echo "DISCORD_STATUS_WEBHOOK_URL is configured."
          fi

      - name: Run scanner once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
          SHIVA_ENABLE_XSTOCK_HYBRID_RATINGS: "true"
          SHIVA_XSTOCK_REGULAR_MIN_SCORE: "5"
          SHIVA_XSTOCK_EXTENDED_MIN_SCORE: "5"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --once

      - name: Persist runtime state
        run: bash .github/scripts/persist_runtime_state.sh alert_state.json crypto_alert_records.jsonl

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
