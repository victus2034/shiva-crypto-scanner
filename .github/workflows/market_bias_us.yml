name: Shiva US Session Bias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    # Temporarily paused by request. Remove this line to re-enable market bias.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send US session bias
        env:
          BIAS_SESSION: us
          DISCORD_BIAS_WEBHOOK_URL: ${{ secrets.DISCORD_BIAS_WEBHOOK_URL }}
        run: python market_bias.py --session "$BIAS_SESSION"
