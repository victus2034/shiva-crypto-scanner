name: Victus Crypto Scanner 30m

on:
  # Triggered by cron-job.org, which dispatches this workflow over the
  # API. GitHub's own scheduler is not used: it honours only a fraction
  # of scheduled runs (two of a possible 230 on 30 Aug 2026), and having
  # both fire dispatched every job twice.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: victus-indicator-strategy-30m
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: bash .github/scripts/restore_runtime_state.sh alert_state_30m_live_price.json crypto_alert_records_30m.jsonl

      - name: Check 30-minute Discord webhook configuration
        env:
          DISCORD_30M_WEBHOOK_URL: ${{ secrets.DISCORD_30M_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_30M_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_30M_WEBHOOK_URL is not configured."
          else
            echo "DISCORD_30M_WEBHOOK_URL is configured."
          fi

          if [ -z "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_STATUS_WEBHOOK_URL is not configured."
          else
            echo "DISCORD_STATUS_WEBHOOK_URL is configured."
          fi

      - name: Run 30-minute scanner once
        env:
          VICTUS_TIMEFRAME: "30m"
          VICTUS_MIN_DISTANCE_PCT: "0.0"
          VICTUS_MAX_DISTANCE_PCT: "0.20"
          VICTUS_STATE_FILE: "alert_state_30m_live_price.json"
          VICTUS_USE_LIVE_TICKER: "true"
          VICTUS_ALERT_COOLDOWN_SECONDS: "1800"
          VICTUS_SIGNAL_ALERT_COOLDOWN_SECONDS: "1800"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_30M_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
          VICTUS_ENABLE_XSTOCK_HYBRID_RATINGS: "true"
          VICTUS_XSTOCK_REGULAR_MIN_SCORE: "5"
          VICTUS_XSTOCK_EXTENDED_MIN_SCORE: "5"
        run: python scanner.py --once

      - name: Persist runtime state
        run: bash .github/scripts/persist_runtime_state.sh alert_state_30m_live_price.json crypto_alert_records_30m.jsonl

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
