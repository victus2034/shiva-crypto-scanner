name: Victus NSE Scanner 30m

on:
  # Triggered by cron-job.org, which dispatches this workflow over the
  # API. GitHub's own scheduler is not used: it honours only a fraction
  # of scheduled runs (two of a possible 230 on 30 Aug 2026), and having
  # both fire dispatched every job twice.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: victus-nse-scanner-30m
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: bash .github/scripts/restore_runtime_state.sh nse_alert_state_30m.json nse_alert_records_30m.jsonl

      - name: Check NSE 30-minute Discord webhook configuration
        env:
          DISCORD_NSE_30M_WEBHOOK_URL: ${{ secrets.DISCORD_NSE_30M_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_NSE_30M_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_NSE_30M_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [ -z "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_STATUS_WEBHOOK_URL is not configured."
          fi

      - name: Run NSE 30-minute scanner once
        env:
          DISCORD_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_NSE_30M_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: python nse_scanner_30m.py --once

      - name: Persist runtime state
        run: bash .github/scripts/persist_runtime_state.sh nse_alert_state_30m.json nse_alert_records_30m.jsonl

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
