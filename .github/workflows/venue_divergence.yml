name: Victus Venue Divergence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victus-venue-divergence
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only: posts nothing and changes no config. The answer is read
      # from these logs.
      - name: Compare CoinSwitch against KuCoin
        env:
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
        run: python venue_divergence.py
