name: Shiva Daily Backtest Summary

on:
  schedule:
    # GitHub Actions uses UTC. 11:00 UTC = 16:30 IST.
    # Crypto runs daily; NSE duplicate protection prevents stale weekend reposts.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "30m"
          - "4h"
      market:
        description: "Market to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "nse"
          - "crypto"
      date:
        description: "Optional IST date to summarize, YYYY-MM-DD"
        required: false

permissions:
  contents: write

concurrency:
  group: shiva-daily-backtest-summary
  cancel-in-progress: false

jobs:
  daily-backtest-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check daily backtest Discord webhook
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_DAILY_BACKTEST_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_DAILY_BACKTEST_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Post daily backtest summary
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
        run: |
          TIMEFRAME="${INPUT_TIMEFRAME:-both}"
          MARKET="${INPUT_MARKET:-both}"
          run_summary() {
            if [ -n "$INPUT_DATE" ]; then
              python daily_backtest_summary.py --market "$1" --timeframe "$2" --date "$INPUT_DATE"
            else
              python daily_backtest_summary.py --market "$1" --timeframe "$2"
            fi
          }

          if [ "$MARKET" = "both" ]; then
            MARKETS="nse crypto"
          else
            MARKETS="$MARKET"
          fi

          if [ "$TIMEFRAME" = "both" ]; then
            TIMEFRAMES="30m 4h"
          else
            TIMEFRAMES="$TIMEFRAME"
          fi

          for market in $MARKETS; do
            for timeframe in $TIMEFRAMES; do
              run_summary "$market" "$timeframe"
            done
          done

      - name: Persist daily backtest report state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f daily_backtest_reports_sent.json ]; then
            git add -f daily_backtest_reports_sent.json
          fi
          if [ -f daily_backtest_finalized_records.jsonl ]; then
            git add -f daily_backtest_finalized_records.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No daily backtest report state changes to save."
            exit 0
          fi

          git commit -m "Update daily backtest report state"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "::warning::Daily backtest state push failed on attempt ${attempt}; refreshing branch before retry."
            git pull --rebase origin main || {
              echo "::warning::Could not rebase daily backtest state. Report was already sent, so not failing the workflow."
              exit 0
            }
          done

          echo "::warning::Could not persist daily backtest report state after retries. Report was already sent, so not failing the workflow."
