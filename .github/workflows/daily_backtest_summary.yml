name: Shiva Daily Backtest Summary

on:
  schedule:
    # GitHub Actions uses UTC. 11:00 UTC = 16:30 IST.
    # Crypto runs daily; NSE duplicate protection prevents stale weekend reposts.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "30m"
          - "4h"
      market:
        description: "Market to summarize"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "nse"
          - "crypto"
          - "xstock"
          - "other"
      date:
        description: "Optional IST date to summarize, YYYY-MM-DD"
        required: false
      force:
        description: "Send even if the report was already sent"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Compute and print the report without posting to Discord or persisting state"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      debug_exchange:
        description: "Log which exchange served crypto OHLCV data for each symbol"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: shiva-daily-backtest-summary
  cancel-in-progress: false

jobs:
  daily-backtest-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: |
          bash .github/scripts/restore_runtime_state.sh \
            nse_alert_records.jsonl \
            nse_alert_records_30m.jsonl \
            crypto_alert_records.jsonl \
            crypto_alert_records_30m.jsonl \
            daily_backtest_reports_sent.json \
            daily_backtest_finalized_records.jsonl \
            daily_backtest_pending_records.jsonl

      - name: Check daily backtest Discord webhook
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_DAILY_BACKTEST_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_DAILY_BACKTEST_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Post daily backtest summary
        env:
          DISCORD_DAILY_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_BACKTEST_WEBHOOK_URL }}
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          COINSWITCH_EXCHANGE: ${{ secrets.COINSWITCH_EXCHANGE }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_TIMEFRAME: ${{ github.event.inputs.timeframe }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          SHIVA_BACKTEST_DEBUG_EXCHANGE: ${{ github.event.inputs.debug_exchange }}
        run: |
          TIMEFRAME="${INPUT_TIMEFRAME:-both}"
          MARKET="${INPUT_MARKET:-both}"
          FORCE="${INPUT_FORCE:-false}"
          DRY_RUN="${INPUT_DRY_RUN:-false}"
          echo "Daily backtest inputs: market=$MARKET timeframe=$TIMEFRAME date=${INPUT_DATE:-auto} force=$FORCE dry_run=$DRY_RUN"
          run_summary() {
            echo "Running daily backtest: market=$1 timeframe=$2 date=${INPUT_DATE:-auto}"
            EXTRA_ARGS=()
            if [ -n "$INPUT_DATE" ]; then
              EXTRA_ARGS+=(--date "$INPUT_DATE")
            fi
            if [ "$FORCE" = "true" ]; then
              EXTRA_ARGS+=(--force)
            fi
            if [ "$DRY_RUN" = "true" ]; then
              EXTRA_ARGS+=(--dry-run)
            fi
            python daily_backtest_summary.py --market "$1" --timeframe "$2" "${EXTRA_ARGS[@]}"
          }

          if [ "$MARKET" = "both" ]; then
            MARKETS="nse crypto xstock"
          else
            MARKETS="$MARKET"
          fi

          if [ "$TIMEFRAME" = "both" ]; then
            TIMEFRAMES="30m 4h"
          else
            TIMEFRAMES="$TIMEFRAME"
          fi

          for market in $MARKETS; do
            for timeframe in $TIMEFRAMES; do
              run_summary "$market" "$timeframe"
            done
          done

      - name: Persist runtime state
        run: |
          bash .github/scripts/persist_runtime_state.sh \
            daily_backtest_reports_sent.json \
            daily_backtest_finalized_records.jsonl \
            daily_backtest_pending_records.jsonl
