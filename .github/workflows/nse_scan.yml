name: Shiva NSE Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shiva-nse-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime state
        run: bash .github/scripts/restore_runtime_state.sh nse_alert_state.json nse_alert_records.jsonl

      - name: Check Discord webhook configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_NSE_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_NSE_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_NSE_WEBHOOK_URL is not configured. NSE alerts will fall back to DISCORD_WEBHOOK_URL."
          elif [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_NSE_WEBHOOK_URL is configured."
          else
            echo "DISCORD_NSE_WEBHOOK_URL is configured."
          fi

          if [ -z "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_STATUS_WEBHOOK_URL is not configured. NSE scanner status will fall back to alert webhook."
          else
            echo "DISCORD_STATUS_WEBHOOK_URL is configured."
          fi

      - name: Run NSE scanner once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NSE_WEBHOOK_URL: ${{ secrets.DISCORD_NSE_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: python nse_scanner.py --once

      - name: Persist runtime state
        run: bash .github/scripts/persist_runtime_state.sh nse_alert_state.json nse_alert_records.jsonl

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
