name: Shiva Market Bias Force Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send NSE force-test alert
        env:
          DISCORD_BIAS_WEBHOOK_URL: ${{ secrets.DISCORD_BIAS_WEBHOOK_URL }}
        run: python market_bias.py --force-test india
      - name: Send US force-test alert
        env:
          DISCORD_BIAS_WEBHOOK_URL: ${{ secrets.DISCORD_BIAS_WEBHOOK_URL }}
        run: python market_bias.py --force-test us
