name: Victus Daily Astrology

on:
  schedule:
    # GitHub Actions uses UTC. 01:30 UTC = 07:00 IST.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the briefing without posting to Discord"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: victus-daily-astrology
  cancel-in-progress: false

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install astrology dependency
        run: npm ci

      - name: Check private Discord webhook
        env:
          DISCORD_ASTROLOGY_WEBHOOK_URL: ${{ secrets.DISCORD_ASTROLOGY_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_ASTROLOGY_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_ASTROLOGY_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Send Victus's daily astrology briefing
        env:
          DISCORD_ASTROLOGY_WEBHOOK_URL: ${{ secrets.DISCORD_ASTROLOGY_WEBHOOK_URL }}
          ASTROLOGY_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: npm run astrology

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_STATUS_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **${{ github.workflow }}** failed (run ${{ github.run_id }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_STATUS_WEBHOOK_URL" || true
          fi
