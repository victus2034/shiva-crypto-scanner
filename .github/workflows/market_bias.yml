name: Shiva Market Bias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    # Temporarily paused by request. Remove this line to re-enable market bias.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send market bias report
        env:
          DISCORD_BIAS_WEBHOOK_URL: ${{ secrets.DISCORD_BIAS_WEBHOOK_URL }}
        run: python market_bias.py
